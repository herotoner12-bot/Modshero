name: Build HERO BACKUP from ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (zip or extracted)
        run: |
          echo "== files in repo =="
          find . -path ./.git -prune -o -type f -print | head -50
          if [ -f settings.gradle.kts ]; then
            PROJ="."
          else
            ZIP=$(find . -path ./.git -prune -o -iname 'HERO-BACKUP*.zip' -print | head -1)
            [ -z "$ZIP" ] && ZIP=$(find . -path ./.git -prune -o -iname '*.zip' -print | head -1)
            if [ -n "$ZIP" ]; then
              echo "Using zip: $ZIP"
              unzip -q "$ZIP" -d _proj
            fi
            SETTINGS=$(find . -path ./.git -prune -o -name settings.gradle.kts -print | head -1)
            if [ -z "$SETTINGS" ]; then
              echo "ERROR: no project found. Upload HERO-BACKUP-ANDROID16.zip to the repo root."
              exit 1
            fi
            PROJ=$(dirname "$SETTINGS")
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Project dir: $PROJ"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        working-directory: ${{ env.PROJ }}
        continue-on-error: true
        env:
          LC_ALL: C.UTF-8
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Name APK HERO-BACKUP-3.0.1.apk
        working-directory: ${{ env.PROJ }}
        run: cp app/build/outputs/apk/debug/app-debug.apk HERO-BACKUP-3.0.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HERO-BACKUP-APK
          path: |
            ${{ env.PROJ }}/HERO-BACKUP-3.0.1.apk
            ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
