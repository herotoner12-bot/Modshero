name: Build HERO MODS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (works for extracted files or an uploaded ZIP, even nested in a folder)
        id: loc
        run: |
          P=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n1 || true)
          if [ -z "$P" ]; then
            Z=$(find . -iname "*.zip" -not -path "./.git/*" | head -n1 || true)
            if [ -z "$Z" ]; then
              echo "No settings.gradle.kts and no ZIP file found in the repository. Files:"
              find . -not -path "./.git/*" | head -n 80
              exit 1
            fi
            echo "Unpacking $Z"
            mkdir -p _proj
            unzip -o "$Z" -d _proj
            P=$(find _proj -name settings.gradle.kts | head -n1 || true)
          fi
          if [ -z "$P" ]; then
            echo "settings.gradle.kts was not found. Files:"
            find . -not -path "./.git/*" | head -n 80
            exit 1
          fi
          D=$(dirname "$P")
          echo "Project directory: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed release APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp "${{ steps.loc.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" out/HERO-MODS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HERO-MODS-apk
          path: out/HERO-MODS.apk

      - name: Publish as GitHub Release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/HERO-MODS.apk --title "HERO MODS" --notes "Build ${{ github.run_number }}"
