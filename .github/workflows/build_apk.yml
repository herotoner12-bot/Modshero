name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Locate Android Project Root and Build APK
      run: |
        # البحث عن المجلد الفرعي الذي يحتوي على ملف settings.gradle أو build.gradle للمشروع الحقيقي
        PROJECT_DIR=""
        if [ -f "settings.gradle" ] || [ -f "build.gradle" ]; then
          PROJECT_DIR="."
        else
          # البحث في المجلدات الفرعية
          PROJECT_DIR=$(find . -maxdepth 2 -name "settings.gradle" -exec dirname {} \; | head -n 1)
        fi

        if [ -z "$PROJECT_DIR" ]; then
          echo "Error: Could not find Gradle build root directory!"
          exit 1
        fi

        echo "Found Android project root at: $PROJECT_DIR"
        cd "$PROJECT_DIR"

        # التأكد من صلاحيات Gradle Wrapper وتنفيذ البناء
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
        elif [ -f "../gradlew" ]; then
          cp ../gradlew ./
          chmod +x gradlew
        fi

        # تنفيذ بناء ديباج APK للمشروع الحقيقي
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HERO-BACKUP-APK
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
        if-no-files-found: error
